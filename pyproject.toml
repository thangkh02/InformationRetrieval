[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-search"
version = "0.1.0"
description = "Simple information retrieval system with TF-IDF, cosine similarity, and top-k ranking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4.2",
  "numpy>=1.26.4",
  "faiss-cpu>=1.8.0",
  "rank-bm25>=0.2.2",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "underthesea>=6.8.4",
  "scikit-learn>=1.5.1",
  "sentence-transformers>=5.2.0",
  "streamlit>=1.37.0",
]

[project.scripts]
ir-search = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
